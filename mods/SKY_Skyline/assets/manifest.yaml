# SKY_Skyline asset manifest.
#
# status:  planned -> spec -> generated -> configured -> packed -> tested -> done
#   generated  : P3D/texture produced by the generators in assets/ (MLOD / PNG source)
#   configured : config.cpp / model.cfg / rvmat written (assets/gen_configs.py)
#   packed     : binarized + signed PBO (Windows: Build-Mod / Sign-Mod)          [needs Windows]
#   tested     : DayZDiag gates passed (perf FPS, qa collisions/doors/AI, clean logs) [needs Windows]
#   done       : all three gates (perf-engineer, security-auditor, qa-tester) signed off
#
# Budgets are HYPOTHESES (reviews/perf_review.md) until confirmed by the DayZDiag
# FPS protocol at 2 view distances. Units: tris per LOD; sec = sections (materials);
# comps = Geometry ComponentNN. assets/check_assets.py enforces the numeric budgets.
#
# Grid: 3.0 m bays, floor-to-floor 3.5 m, module origin = top of slab, autocenter=0.

defaults:
  texture_size: 2048
  constant_maps: constant-value smdi/as maps are emitted at 256 px
  required_lods_enterable: [Resolution x3+, Shadow Volume, Geometry, Fire Geometry, View Geometry, Roadway, Memory]
  paths_lod: >-
    Not generated. DayZ AI uses the runtime navmesh: objectSpawnersArr creates
    buildings with ECE_UPDATEPATHGRAPH and calls ProcessMarkedObjectsForPathgraphUpdate()
    (3_game/objectspawner.c), and Bohemia's Test_Building sample has no Paths LOD.
    AI pathing is verified in DayZDiag instead (qa gate).

# ---------------------------------------------------------------- A. modular kit
kit:
  - name: Land_SKY_TowerA_Lobby
    type: lobby/podium (double height, keycard security room)
    p3d: addons/sky_towera/sky_towera_lobby.p3d
    budget: {res0: 2000, res1: 1200, res2: 150, res3: 30, shadow: 120, geo_comps: 32, geo_tris: 400, sections_res0: 5}
    textures: [concrete, glass, metal, tile, glassfar]
    status: configured
  - name: Land_SKY_Lobby_B
    type: lobby/podium variant 2 (retail frontage)
    status: planned
  - name: Land_SKY_TowerA_Floor_Office
    type: typical floor (office)
    p3d: addons/sky_towera/sky_towera_floor_office.p3d
    budget: {res0: 1500, res1: 900, res2: 120, res3: 24, shadow: 100, geo_comps: 24, geo_tris: 300, sections_res0: 5}
    textures: [concrete, glass, metal, carpet, wall, glassfar]
    status: configured
  - {name: Land_SKY_Floor_Apartments, type: typical floor (apartments), status: planned}
  - {name: Land_SKY_Floor_Hotel, type: typical floor (hotel), status: planned}
  - name: Land_SKY_TowerA_Core
    type: stair + elevator core (7 stops, teleport elevator, script Land_SKY_TowerA_Core)
    p3d: addons/sky_towera/sky_towera_core.p3d
    budget: {res0: 2000, res1: 1000, res2: 150, res3: 20, shadow: 24, geo_comps: 80, geo_tris: 1000, sections_res0: 3}
    textures: [concrete, metal, tile]
    status: configured
    open_items: [Res0 2322 > 2000 (stair steps), Res2 252 > 150, Geometry 99 comps > 80 (merge plan in perf_review M2)]
  - {name: Land_SKY_Floor_Mechanical, type: mechanical floor, status: planned}
  - name: Land_SKY_TowerA_Roof_Helipad
    type: roof (helipad)
    p3d: addons/sky_towera/sky_towera_roof_helipad.p3d
    budget: {res0: 300, res1: 120, res2: 100, res3: 50, shadow: 100, geo_comps: 12, geo_tris: 150, sections_res0: 2}
    textures: [concrete, roofmark]
    status: configured
  - {name: Land_SKY_Roof_Mechanical, type: roof (mechanical), status: planned}
  - {name: Land_SKY_Roof_Garden, type: roof (garden), status: planned}
  - {name: Land_SKY_Skybridge, type: skybridge, status: planned}
  - {name: SKY_Facade_Glass, type: facade variant, status: generated, note: built into floor/lobby generators (facade())}
  - {name: SKY_Facade_Concrete, type: facade variant, status: planned}
  - {name: SKY_Facade_Brick, type: facade variant, status: planned}

