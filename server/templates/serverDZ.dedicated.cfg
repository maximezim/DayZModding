// Local dedicated-server config: mirrors a production setup (signatures, BattlEye on).
// Rendered to server\serverDZ.dedicated.cfg by tools\setup\Initialize-TestServer.ps1.
hostname = "DayZModding local dedicated";
password = "";
passwordAdmin = "__ADMIN_PASSWORD__";
maxPlayers = 10;

verifySignatures = 2;        // only PBOs signed with a key in <server>\keys
BattlEye = 1;
allowFilePatching = 0;
forceSameBuild = 1;

disableVoN = 0;
vonCodecQuality = 20;
disable3rdPerson = 0;
disableCrosshair = 0;
disablePersonalLight = 1;
lightingConfig = 0;
serverTime = "SystemTime";
serverTimeAcceleration = 12;
serverNightTimeAcceleration = 4;
serverTimePersistent = 0;
guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 500;
instanceId = 1;
storageAutoFix = 1;

class Missions
{
    class DayZ
    {
        template = "__MISSION__";
    };
};
