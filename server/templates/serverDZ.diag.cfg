// Local DayZDiag listen-server config for mod development.
// Rendered to server\serverDZ.diag.cfg by tools\setup\Initialize-TestServer.ps1
// (the rendered copy is git-ignored because it holds a generated admin password).
hostname = "DayZModding local diag";
password = "";
passwordAdmin = "__ADMIN_PASSWORD__";
maxPlayers = 4;

verifySignatures = 0;        // diag: load unsigned work-in-progress PBOs
BattlEye = 0;                // diag executables do not run BattlEye
allowFilePatching = 1;       // required for -filePatching clients
forceSameBuild = 1;

disableVoN = 1;
disable3rdPerson = 0;
disableCrosshair = 0;
disablePersonalLight = 1;
lightingConfig = 0;
serverTime = "2026/6/1/10/00";   // fixed daylight for repeatable tests
serverTimeAcceleration = 1;
serverNightTimeAcceleration = 1;
serverTimePersistent = 0;
guaranteedUpdates = 1;
loginQueueConcurrentPlayers = 5;
loginQueueMaxPlayers = 50;
instanceId = 1;
storageAutoFix = 1;

class Missions
{
    class DayZ
    {
        template = "__MISSION__";
    };
};
